services:
  mysql:
    image: mysql:8.3
    container_name: cadence-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: password
      # Per-service database users (docker/mysql/init/01-service-schemas.sh). Defaults are for local development;
      # override them in a .env file next to compose.yaml.
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_dev_password}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_dev_password}
      PLAYLIST_DB_PASSWORD: ${PLAYLIST_DB_PASSWORD:-playlist_dev_password}
      STREAMING_DB_PASSWORD: ${STREAMING_DB_PASSWORD:-streaming_dev_password}
    command:
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    volumes:
      - cadence-mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  kafka:
    image: apache/kafka:3.7.0
    container_name: cadence-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Two PLAINTEXT listeners: INTERNAL for in-network containers,
      # HOST for the developer's machine (tests, local CLIs).
      KAFKA_LISTENERS: INTERNAL://:29092,HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - cadence-kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s

  loki:
    image: grafana/loki:3.5.0
    container_name: cadence-loki
    ports:
      - "3102:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - cadence-loki-data:/loki

  prometheus:
    image: prom/prometheus:v2.46.0
    command:
      - --enable-feature=exemplar-storage
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - '9090:9090'

  tempo:
    image: grafana/tempo:2.2.2
    command: ['-config.file=/etc/tempo.yaml']
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo.yaml:ro
      - ./docker/tempo/tempo-data:/tmp/tempo
    ports:
      - '3110:3200' # Tempo
      - '9411:9411' # zipkin

  grafana:
    image: grafana/grafana:10.1.0
    volumes:
      - ./docker/grafana:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    ports:
      - '3001:3000'

  discovery-service:
    build:
      context: ./discovery-service
    container_name: cadence-discovery
    environment:
      LOKI_URL: http://loki:3100/loki/api/v1/push
      ZIPKIN_URL: http://tempo:9411/api/v2/spans
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8761/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  config-server:
    build:
      context: ./config-server
    container_name: cadence-config
    environment:
      LOKI_URL: http://loki:3100/loki/api/v1/push
      ZIPKIN_URL: http://tempo:9411/api/v2/spans
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8888/auth-service/default >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: cadence-auth
    env_file:
      - env.properties
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DATASOURCE_USERNAME: auth_svc
      DATASOURCE_PASSWORD: ${AUTH_DB_PASSWORD:-auth_dev_password}
      KAFKA_URL: kafka:29092
      LOKI_URL: http://loki:3100/loki/api/v1/push
      ZIPKIN_URL: http://tempo:9411/api/v2/spans
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy

  catalog-service:
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    container_name: cadence-catalog
    env_file:
      - env.properties
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      DATASOURCE_URL: jdbc:mysql://mysql:3306/catalog_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DATASOURCE_USERNAME: catalog_svc
      DATASOURCE_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_dev_password}
      KAFKA_URL: kafka:29092
      LOKI_URL: http://loki:3100/loki/api/v1/push
      ZIPKIN_URL: http://tempo:9411/api/v2/spans
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy

  playlist-service:
    build:
      context: .
      dockerfile: playlist-service/Dockerfile
    container_name: cadence-playlist
    env_file:
      - env.properties
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      DATASOURCE_URL: jdbc:mysql://mysql:3306/playlist_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DATASOURCE_USERNAME: playlist_svc
      DATASOURCE_PASSWORD: ${PLAYLIST_DB_PASSWORD:-playlist_dev_password}
      KAFKA_URL: kafka:29092
      LOKI_URL: http://loki:3100/loki/api/v1/push
      ZIPKIN_URL: http://tempo:9411/api/v2/spans
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy

  streaming-service:
    build:
      context: .
      dockerfile: streaming-service/Dockerfile
    container_name: cadence-streaming
    env_file:
      - env.properties
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      DATASOURCE_URL: jdbc:mysql://mysql:3306/streaming_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      DATASOURCE_USERNAME: streaming_svc
      DATASOURCE_PASSWORD: ${STREAMING_DB_PASSWORD:-streaming_dev_password}
      KAFKA_URL: kafka:29092
      LOKI_URL: http://loki:3100/loki/api/v1/push
      ZIPKIN_URL: http://tempo:9411/api/v2/spans
      # Where the key is mounted below; overrides the host path in env.properties
      AWS_CLOUDFRONT_PRIVATE_KEY_PATH: /run/secrets/cloudfront_private_key.pem
    volumes:
      - ./secrets/cloudfront_private_key.pem:/run/secrets/cloudfront_private_key.pem:ro
    depends_on:
      mysql:
        condition: service_healthy
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: cadence-notification
    env_file:
      - env.properties
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      KAFKA_URL: kafka:29092
      LOKI_URL: http://loki:3100/loki/api/v1/push
      ZIPKIN_URL: http://tempo:9411/api/v2/spans
    depends_on:
      kafka:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy

  gateway-service:
    build:
      context: ./gateway-service
    container_name: cadence-gateway
    ports:
      - "8080:8080"
    env_file:
      - env.properties
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_SERVER_URL: http://discovery-service:8761/eureka
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      # CORS origins the browser is allowed to call from. Override to add
      # production domains as a comma-separated list.
      FRONTEND_URL: http://localhost:3000
      LOKI_URL: http://loki:3100/loki/api/v1/push
      ZIPKIN_URL: http://tempo:9411/api/v2/spans
    depends_on:
      discovery-service:
        condition: service_healthy
      config-server:
        condition: service_healthy
      auth-service:
        condition: service_started
      catalog-service:
        condition: service_started
      playlist-service:
        condition: service_started
      streaming-service:
        condition: service_started
      notification-service:
        condition: service_started

  frontend:
    build:
      context: ./cadence-frontend
      args:
        # NEXT_PUBLIC_* vars are inlined into the client bundle at build time.
        # The browser hits the host-published gateway port, not docker DNS.
        NEXT_PUBLIC_API_URL: http://localhost:8080/
    container_name: cadence-frontend
    ports:
      - "3000:3000"
    depends_on:
      gateway-service:
        condition: service_started

volumes:
  cadence-mysql-data:
  cadence-kafka-data:
  cadence-loki-data:
