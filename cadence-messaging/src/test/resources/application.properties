spring.jpa.hibernate.ddl-auto=create-drop
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Tests drive the relay by hand.
cadence.messaging.outbox.relay-enabled=false
cadence.messaging.consumer.max-retries=1
cadence.messaging.consumer.initial-backoff=100ms
# Topics appear on first send; let listeners notice them quickly.
spring.kafka.consumer.properties.metadata.max.age.ms=500
cadence.messaging.outbox.send-timeout=3s
