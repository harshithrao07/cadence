# Properties applied to every service that pulls from this config server.

gateway.secret=${GATEWAY_SECRET}

# Prefix every log line with the saga id of the event being handled (set by cadence-messaging),
# so one saga can be traced across services by grepping for its id.
logging.pattern.level=%5p [saga:%X{sagaId:-}]

# Kafka clients refresh topic metadata every 30 s instead of 5 min, so consumers notice new partitions
# (e.g. a topic grown by a NewTopic bean) and topics created after they subscribed without a restart.
spring.kafka.properties.metadata.max.age.ms=30000

# Kafka listeners continue the trace from the record's traceparent header (set by the outbox relay), so a saga
# is one trace from the request that started it.
spring.kafka.listener.observation-enabled=true

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Expose /actuator/refresh so clients can re-fetch config without restart.
# POST to /actuator/refresh after editing centralconfigs/ — beans bound via
# @ConfigurationProperties are automatically rebound and @RefreshScope beans
# are recreated on next access.
# Also expose circuitbreakers + circuitbreakerevents for inspecting Resilience4j state,
# and metrics + prometheus so Prometheus can scrape /actuator/prometheus.
management.endpoints.web.exposure.include=health,info,refresh,circuitbreakers,circuitbreakerevents,metrics,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.key-values.application=${spring.application.name}
management.metrics.tags.application=${spring.application.name}

# Send every trace (the default is 10%) to Tempo's Zipkin receiver.
management.tracing.sampling.probability=1.0
management.zipkin.tracing.endpoint=${ZIPKIN_URL:http://localhost:9411/api/v2/spans}

# ── Resilience4j defaults for Feign clients ──────────────────────────────
# Wrap every Feign call in a circuit breaker + time limiter via spring-cloud-openfeign.
# Each @FeignClient that declares fallback=... gets graceful degradation when the
# downstream is slow, failing, or down.
spring.cloud.openfeign.circuitbreaker.enabled=true

# Default circuit breaker — applied to any @FeignClient by name unless overridden.
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true

# Default time limiter — bounds how long any wrapped call can take.
resilience4j.timelimiter.configs.default.timeout-duration=3s
resilience4j.timelimiter.configs.default.cancel-running-future=true

# Default retry — retry transient failures with exponential backoff.
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=500ms
resilience4j.retry.configs.default.exponential-backoff-multiplier=2
resilience4j.retry.configs.default.retry-exceptions=\
  java.io.IOException,\
  java.util.concurrent.TimeoutException,\
  feign.RetryableException
