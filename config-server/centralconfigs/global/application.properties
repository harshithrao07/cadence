# Properties applied to every service that pulls from this config server.

gateway.secret=${GATEWAY_SECRET}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Expose /actuator/refresh so clients can re-fetch config without restart.
# POST to /actuator/refresh after editing centralconfigs/ — beans bound via
# @ConfigurationProperties are automatically rebound and @RefreshScope beans
# are recreated on next access.
# Also expose circuitbreakers + circuitbreakerevents for inspecting Resilience4j state.
management.endpoints.web.exposure.include=health,info,refresh,circuitbreakers,circuitbreakerevents

# ── Resilience4j defaults for Feign clients ──────────────────────────────
# Wrap every Feign call in a circuit breaker + time limiter via spring-cloud-openfeign.
# Each @FeignClient that declares fallback=... gets graceful degradation when the
# downstream is slow, failing, or down.
spring.cloud.openfeign.circuitbreaker.enabled=true

# Default circuit breaker — applied to any @FeignClient by name unless overridden.
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=50
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=2s
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true

# Default time limiter — bounds how long any wrapped call can take.
resilience4j.timelimiter.configs.default.timeout-duration=3s
resilience4j.timelimiter.configs.default.cancel-running-future=true

# Default retry — retry transient failures with exponential backoff.
resilience4j.retry.configs.default.max-attempts=3
resilience4j.retry.configs.default.wait-duration=500ms
resilience4j.retry.configs.default.exponential-backoff-multiplier=2
resilience4j.retry.configs.default.retry-exceptions=\
  java.io.IOException,\
  java.util.concurrent.TimeoutException,\
  feign.RetryableException
