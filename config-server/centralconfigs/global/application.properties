# Properties applied to every service that pulls from this config server.

gateway.secret=${GATEWAY_SECRET}

eureka.client.service-url.defaultZone=${EUREKA_SERVER_URL:http://localhost:8761/eureka}
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Expose /actuator/refresh so clients can re-fetch config without restart.
# POST to /actuator/refresh after editing centralconfigs/ — beans bound via
# @ConfigurationProperties are automatically rebound and @RefreshScope beans
# are recreated on next access.
management.endpoints.web.exposure.include=health,info,refresh
