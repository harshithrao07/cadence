spring.datasource.url=${DATASOURCE_URL}
spring.datasource.username=${DATASOURCE_USERNAME}
spring.datasource.password=${DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true

# Hikari sizing — receives Feign fan-out from catalog-service.getDiscoveryFeed
# (3 calls per /discover request). Default of 10 connections gets exhausted
# quickly when catalog itself is under load.
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.connection-timeout=10000

cloud.aws.credentials.accessKey=${AWS_ACCESS_KEY}
cloud.aws.credentials.secretKey=${AWS_SECRET_KEY}
cloud.aws.region.static=${AWS_REGION}
cloud.aws.s3.bucket=${AWS_S3_BUCKET}
# CloudFront distribution in front of the bucket; song URLs are signed with this key pair.
# The private key is a PEM file (PKCS#1 or PKCS#8); compose mounts secrets/cloudfront_private_key.pem.
cloud.aws.cloudfront.domain=${AWS_CLOUDFRONT_DOMAIN}
cloud.aws.cloudfront.key-pair-id=${AWS_CLOUDFRONT_KEY_PAIR_ID}
cloud.aws.cloudfront.private-key-path=${AWS_CLOUDFRONT_PRIVATE_KEY_PATH}

# Kafka: consumes catalog.songs-deleted (EventEnvelope JSON strings via cadence-messaging).
spring.kafka.bootstrap-servers=${KAFKA_URL:localhost:9092}
spring.kafka.consumer.group-id=streaming-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
